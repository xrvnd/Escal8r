[project]
name = "escal8r"
version = "0.1.0"
description = "Support ticket agent for the Roosterly helpdesk: reply, handoff or close."
readme = "README.md"
authors = [{ name = "Arvind" }]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
]

[project.scripts]
escal8r = "escal8r.cli:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: calls a real external API (deselected by default)"]
addopts = "-m 'not network'"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
